name: Publish a manually approved versioned release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 build_release.py
      - name: Create draft release (owner publishes after review)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          gh release create "v$VERSION" dist/* --draft --title "VPN DNS Guard v$VERSION" --notes-file CHANGELOG.md
